<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Talk to Hamdan · Ajman Department of Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="call.css">
</head>
<body>
  <!-- Closed state: the character the visitor taps to call -->
  <button id="launcher" class="launcher" type="button">
    <span class="launcher-avatar" data-avatar></span>
    <span class="launcher-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
    </span>
    <span class="launcher-live" aria-hidden="true"></span>
  </button>

  <!-- Open state: the call panel -->
  <section id="panel" class="panel" role="dialog" aria-labelledby="agent-name" hidden>
    <header class="panel-head">
      <div class="org">
        <strong data-t="org"></strong>
        <span data-t="role"></span>
      </div>
      <button id="minimize" class="icon-btn" type="button" data-t-label="minimize">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </header>

    <div class="stage">
      <div class="avatar-wrap">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <span class="voice-glow"></span>
        <div class="stage-avatar" data-avatar></div>
      </div>
      <h1 id="agent-name" data-t="name"></h1>
      <p class="status" aria-live="polite"><span id="status"></span><span id="timer" class="timer"></span></p>
      <p id="hint" class="hint"></p>
    </div>

    <div class="lower">
      <!-- Before a call (standalone page) -->
      <div class="view view-ready">
        <button id="start" class="call-btn" type="button">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
          <span data-t="start"></span>
        </button>
        <p class="note" data-t="intro"></p>
      </div>

      <!-- During a call -->
      <div class="view view-call">
        <div id="captions" class="captions" aria-live="off"></div>
        <form id="text-form" class="text-form" hidden>
          <input id="text" type="text" dir="auto" maxlength="500" autocomplete="off" data-t-placeholder="typePlaceholder">
          <button class="send" type="submit" data-t-label="send">
            <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
          </button>
        </form>
        <div class="controls">
          <button id="keyboard" class="ctrl" type="button" aria-pressed="false" data-t-label="type">
            <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
          </button>
          <button id="end" class="end-btn" type="button" data-t-label="end">
            <svg viewBox="0 0 24 24"><path d="M3.3 13.6c4.8-4.1 12.6-4.1 17.4 0 .5.4.6 1.1.2 1.6l-1.4 1.8a1.2 1.2 0 0 1-1.5.3l-2.6-1.3a1.2 1.2 0 0 1-.6-1.2l.2-1.6a11 11 0 0 0-6 0l.2 1.6a1.2 1.2 0 0 1-.6 1.2L6 17.3a1.2 1.2 0 0 1-1.5-.3L3.1 15.2a1.2 1.2 0 0 1 .2-1.6z"/></svg>
          </button>
          <button id="mute" class="ctrl" type="button" aria-pressed="false" data-t-label="mute">
            <svg class="mic-on" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <svg class="mic-off" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></svg>
          </button>
        </div>
        <p class="note" data-t="privacy"></p>
      </div>

      <!-- After a call, or when something went wrong -->
      <div class="view view-after">
        <p id="after-msg" class="after-msg"></p>
        <div class="after-actions">
          <button id="again" class="call-btn" type="button">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
            <span id="again-label"></span>
          </button>
          <button id="close" class="text-btn" type="button" data-t="close"></button>
        </div>
      </div>
    </div>
  </section>

  <script src="call.js"></script>
</body>
</html>
